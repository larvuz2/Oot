name: Remix code check

# Compiles the Web Remix C code (menu, custom actor/object and the files they
# touch) with the real IDO compiler for several game versions. Needs no ROM,
# so it catches compile errors even before BASEROM_URL is set up.

on:
  push:
    paths:
      - "src/**"
      - "include/**"
      - "assets/objects/object_remix_model/**"
      - "assets/objects/object_remix_slate/**"
      - "assets/objects/object_remix_magnet/**"
      - "assets/scenes/remix/**"
      - "spec/**"
      - "tools/remix/**"
      - ".github/workflows/remix-code-check.yml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "assets/objects/object_remix_model/**"
      - "assets/objects/object_remix_slate/**"
      - "assets/objects/object_remix_magnet/**"
      - "assets/scenes/remix/**"
      - "spec/**"
      - "tools/remix/**"
      - ".github/workflows/remix-code-check.yml"

jobs:
  compile:
    name: Compile remix code (${{ matrix.version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [ntsc-1.0, ntsc-1.2, pal-1.1, gc-us, gc-eu-mq-dbg]
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential binutils-mips-linux-gnu python3 python3-venv libxml2-dev

      - name: Build tools
        run: |
          make -C tools -j"$(nproc)"
          make venv

      - name: Compile
        run: |
          make -j"$(nproc)" VERSION=${{ matrix.version }} \
            build/${{ matrix.version }}/src/code/z_remix_menu.o \
            build/${{ matrix.version }}/src/code/z_play.o \
            build/${{ matrix.version }}/src/code/z_actor_dlftbls.o \
            build/${{ matrix.version }}/src/code/object_table.o \
            build/${{ matrix.version }}/src/overlays/actors/ovl_En_Remix_Model/z_en_remix_model.o \
            build/${{ matrix.version }}/assets/objects/object_remix_model/object_remix_model.o

      - name: Level 6 (Temple of Two Truths), its actor and object compile
        run: |
          V=${{ matrix.version }}
          G=build/$V/assets/scenes/remix/time
          make -j"$(nproc)" VERSION=$V $(for f in assets/scenes/remix/time/*.png assets/objects/object_remix_time/*.png; do echo build/$V/${f%.png}.inc.c; done)
          make -j"$(nproc)" VERSION=$V $G/time_scene.o $G/time_room_0.o $G/time_title.o \
            build/$V/src/overlays/actors/ovl_En_Remix_Time/z_en_remix_time.o \
            build/$V/assets/objects/object_remix_time/object_remix_time.o
          for f in scene:time_sceneCommands room_0:time_room_0Commands; do
            mips-linux-gnu-nm $G/time_${f%%:*}.o | grep -q "^00000000 D ${f#*:}$" \
              || { echo "${f#*:} is not at the start of time_${f%%:*}"; exit 1; }
          done

      - name: Level 5 (Forge Shrine) compiles
        run: |
          V=${{ matrix.version }}
          G=build/$V/assets/scenes/remix/forge
          make -j"$(nproc)" VERSION=$V $(for f in assets/scenes/remix/forge/*.png; do echo build/$V/${f%.png}.inc.c; done)
          make -j"$(nproc)" VERSION=$V $G/forge_scene.o $G/forge_room_0.o $G/forge_title.o
          for f in scene:forge_sceneCommands room_0:forge_room_0Commands; do
            mips-linux-gnu-nm $G/forge_${f%%:*}.o | grep -q "^00000000 D ${f#*:}$" \
              || { echo "${f#*:} is not at the start of forge_${f%%:*}"; exit 1; }
          done

      - name: Level 4 (Lodestone Shrine), Magnesis and its objects compile
        run: |
          V=${{ matrix.version }}
          G=build/$V/assets/scenes/remix/magnet
          make -j"$(nproc)" VERSION=$V $(for f in assets/scenes/remix/magnet/*.png assets/objects/object_remix_slate/*.png \
            assets/objects/object_remix_magnet/*.png; do echo build/$V/${f%.png}.inc.c; done)
          make -j"$(nproc)" VERSION=$V $G/magnet_scene.o $G/magnet_room_0.o $G/magnet_title.o \
            build/$V/src/overlays/actors/ovl_En_Remix_Magnet/z_en_remix_magnet.o \
            build/$V/assets/objects/object_remix_slate/object_remix_slate.o \
            build/$V/assets/objects/object_remix_magnet/object_remix_magnet.o
          for f in scene:magnet_sceneCommands room_0:magnet_room_0Commands; do
            mips-linux-gnu-nm $G/magnet_${f%%:*}.o | grep -q "^00000000 D ${f#*:}$" \
              || { echo "${f#*:} is not at the start of magnet_${f%%:*}"; exit 1; }
          done
          # the player loads get-item objects into an 8 KB buffer (z_player.c)
          size=$(mips-linux-gnu-size -A build/$V/assets/objects/object_remix_slate/object_remix_slate.o | awk '$1==".data"{print $2}')
          [ "$size" -le 8192 ] || { echo "object_remix_slate is $size bytes: get-item objects must fit in 8 KB"; exit 1; }

      - name: New level (Ancient Plateau) and engine changes compile
        run: |
          V=${{ matrix.version }}
          make -j"$(nproc)" VERSION=$V $(for f in assets/scenes/remix/ancient/*.png; do echo build/$V/${f%.png}.inc.c; done)
          make -j"$(nproc)" VERSION=$V \
            build/$V/assets/scenes/remix/ancient/ancient_scene.o \
            build/$V/assets/scenes/remix/ancient/ancient_room_0.o \
            build/$V/assets/scenes/remix/ancient/ancient_title.o \
            build/$V/src/code/z_remix_level.o \
            build/$V/src/code/z_bgcheck.o
          # the title card holds one 144x24 IA8 image per language (2 on NTSC, 3 on PAL)
          size=$(mips-linux-gnu-size -A build/$V/assets/scenes/remix/ancient/ancient_title.o | awk '$1==".data"{print $2}')
          case "$V" in pal-*|gc-eu*) want=10368;; *) want=6912;; esac
          [ "$size" = "$want" ] || { echo "title card is $size bytes, expected $want"; exit 1; }
          # The game reads a scene's and a room's commands from the start of the file.
          for f in scene:ancient_sceneCommands room_0:ancient_room_0Commands; do
            mips-linux-gnu-nm build/$V/assets/scenes/remix/ancient/ancient_${f%%:*}.o | grep -q "^00000000 D ${f#*:}$" \
              || { echo "${f#*:} is not at the start of ancient_${f%%:*}"; exit 1; }
          done

      - name: Level 2 (Ember Shrine) compiles
        run: |
          V=${{ matrix.version }}
          E=build/$V/assets/scenes/remix/ember
          make -j"$(nproc)" VERSION=$V $(for f in assets/scenes/remix/ember/*.png; do echo build/$V/${f%.png}.inc.c; done)
          make -j"$(nproc)" VERSION=$V $E/ember_scene.o $E/ember_room_0.o $E/ember_title.o
          size=$(mips-linux-gnu-size -A $E/ember_title.o | awk '$1==".data"{print $2}')
          case "$V" in pal-*|gc-eu*) want=10368;; *) want=6912;; esac
          [ "$size" = "$want" ] || { echo "title card is $size bytes, expected $want"; exit 1; }
          for f in scene:ember_sceneCommands room_0:ember_room_0Commands; do
            mips-linux-gnu-nm $E/ember_${f%%:*}.o | grep -q "^00000000 D ${f#*:}$" \
              || { echo "${f#*:} is not at the start of ember_${f%%:*}"; exit 1; }
          done

      - name: Level 3 (Seeker's Shrine) compiles
        run: |
          V=${{ matrix.version }}
          K=build/$V/assets/scenes/remix/seeker
          make -j"$(nproc)" VERSION=$V $(for f in assets/scenes/remix/seeker/*.png; do echo build/$V/${f%.png}.inc.c; done)
          make -j"$(nproc)" VERSION=$V $K/seeker_scene.o $K/seeker_room_0.o $K/seeker_title.o build/$V/src/code/z_sram.o
          for f in scene:seeker_sceneCommands room_0:seeker_room_0Commands; do
            mips-linux-gnu-nm $K/seeker_${f%%:*}.o | grep -q "^00000000 D ${f#*:}$" \
              || { echo "${f#*:} is not at the start of seeker_${f%%:*}"; exit 1; }
          done

      - name: Biome copy (stand-in scene, no ROM) compiles
        run: |
          python3 -m pip install --user --break-system-packages -q "numpy>=1.26" "pillow>=10"
          python3 tools/remix/test_make_biome.py
          python3 tools/remix/test_make_biome.py --fixture extracted/${{ matrix.version }}
          python3 tools/remix/make_biome.py --version ${{ matrix.version }}
          rm -f build/${{ matrix.version }}/src/code/z_remix_menu.o
          make -j"$(nproc)" VERSION=${{ matrix.version }} \
            build/${{ matrix.version }}/src/code/z_remix_menu.o \
            build/${{ matrix.version }}/assets/scenes/overworld/spot00/spot00_scene.o \
            build/${{ matrix.version }}/assets/scenes/overworld/spot00/spot00_room_0.o \
            build/${{ matrix.version }}/assets/scenes/remix/tundra/tundra_scene.o \
            build/${{ matrix.version }}/assets/scenes/remix/tundra/tundra_room_0.o \
            build/${{ matrix.version }}/spec
          grep -q '"tundra_room_0"' build/${{ matrix.version }}/spec
          grep -q '"ancient_room_0"' build/${{ matrix.version }}/spec
          grep -q '"ember_room_0"' build/${{ matrix.version }}/spec
          grep -q '"seeker_room_0"' build/${{ matrix.version }}/spec
          grep -q '"magnet_room_0"' build/${{ matrix.version }}/spec
          grep -q '"forge_room_0"' build/${{ matrix.version }}/spec
          grep -q '"time_room_0"' build/${{ matrix.version }}/spec
          grep -q '"ovl_En_Remix_Time"' build/${{ matrix.version }}/spec
          grep -q '"ovl_En_Remix_Magnet"' build/${{ matrix.version }}/spec
          grep -q 'z_remix_level.o' build/${{ matrix.version }}/spec
          # The copy is linked next to the original: no symbol may be defined in both.
          B=build/${{ matrix.version }}/assets/scenes
          dup=$(comm -12 <(mips-linux-gnu-nm --defined-only -g $B/overworld/spot00/*.o | awk '{print $3}' | sort -u) \
                         <(mips-linux-gnu-nm --defined-only -g $B/remix/tundra/*.o | awk '{print $3}' | sort -u))
          if [ -n "$dup" ]; then echo "Symbols defined in both Hyrule Field and its copy:"; echo "$dup"; exit 1; fi

      - name: New level with Hyrule Field's textures and lights (stand-in, no ROM) compiles
        run: |
          V=${{ matrix.version }}
          python3 tools/remix/test_link_level_assets.py
          python3 tools/remix/test_link_level_assets.py --fixture extracted/$V
          python3 tools/remix/link_level_assets.py --version $V
          for m in GRASS DIRT ROCK LIGHTS; do grep -q "ANCIENT_HF_$m" build/$V/assets/scenes/remix/ancient/ancient_hf.h; done
          rm -f build/$V/assets/scenes/remix/ancient/ancient_scene.o build/$V/assets/scenes/remix/ancient/ancient_room_0.o
          make -j"$(nproc)" VERSION=$V \
            build/$V/assets/scenes/remix/ancient/ancient_scene.o \
            build/$V/assets/scenes/remix/ancient/ancient_room_0.o
          # 17 light settings of 22 bytes come from the stand-in field, and the commands still come first
          mips-linux-gnu-nm -S build/$V/assets/scenes/remix/ancient/ancient_scene.o | grep -q " 00000176 D ancient_sceneLightSettings"
          mips-linux-gnu-nm build/$V/assets/scenes/remix/ancient/ancient_scene.o | grep -q "^00000000 D ancient_sceneCommands$"

      - name: New level with a borrowed town (stand-in, no ROM) compiles
        run: |
          V=${{ matrix.version }}
          python3 -m pip install --user --break-system-packages -q "shapely>=2.0"
          python3 tools/remix/test_make_town.py
          python3 tools/remix/test_make_town.py --build $V
          A=build/$V/assets/scenes/remix/ancient
          rm -f $A/ancient_scene.o $A/ancient_room_0.o build/$V/src/code/z_bgcheck.o
          make -j"$(nproc)" VERSION=$V $A/ancient_scene.o $A/ancient_room_0.o build/$V/src/code/z_bgcheck.o
          for f in scene:ancient_sceneCommands room_0:ancient_room_0Commands; do
            mips-linux-gnu-nm $A/ancient_${f%%:*}.o | grep -q "^00000000 D ${f#*:}$"
          done
          mips-linux-gnu-nm $A/ancient_room_0.o | grep -q " D ancient_town_0_opa$"
