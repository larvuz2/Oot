name: Remix code check

# Compiles the Web Remix C code (menu, custom actor/object and the files they
# touch) with the real IDO compiler for several game versions. Needs no ROM,
# so it catches compile errors even before BASEROM_URL is set up.

on:
  push:
    paths:
      - "src/**"
      - "include/**"
      - "assets/objects/object_remix_model/**"
      - "assets/scenes/remix/**"
      - "spec/**"
      - "tools/remix/**"
      - ".github/workflows/remix-code-check.yml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "assets/objects/object_remix_model/**"
      - "assets/scenes/remix/**"
      - "spec/**"
      - "tools/remix/**"
      - ".github/workflows/remix-code-check.yml"

jobs:
  compile:
    name: Compile remix code (${{ matrix.version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [ntsc-1.0, ntsc-1.2, pal-1.1, gc-us, gc-eu-mq-dbg]
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential binutils-mips-linux-gnu python3 python3-venv libxml2-dev

      - name: Build tools
        run: |
          make -C tools -j"$(nproc)"
          make venv

      - name: Compile
        run: |
          make -j"$(nproc)" VERSION=${{ matrix.version }} \
            build/${{ matrix.version }}/src/code/z_remix_menu.o \
            build/${{ matrix.version }}/src/code/z_play.o \
            build/${{ matrix.version }}/src/code/z_actor_dlftbls.o \
            build/${{ matrix.version }}/src/code/object_table.o \
            build/${{ matrix.version }}/src/overlays/actors/ovl_En_Remix_Model/z_en_remix_model.o \
            build/${{ matrix.version }}/assets/objects/object_remix_model/object_remix_model.o

      - name: New level (Ancient Plateau) and engine changes compile
        run: |
          V=${{ matrix.version }}
          make -j"$(nproc)" VERSION=$V $(for f in assets/scenes/remix/ancient/*.png; do echo build/$V/${f%.png}.inc.c; done)
          make -j"$(nproc)" VERSION=$V \
            build/$V/assets/scenes/remix/ancient/ancient_scene.o \
            build/$V/assets/scenes/remix/ancient/ancient_room_0.o \
            build/$V/assets/scenes/remix/ancient/ancient_title.o \
            build/$V/src/code/z_remix_level.o \
            build/$V/src/code/z_bgcheck.o
          # the title card holds one 144x24 IA8 image per language (2 on NTSC, 3 on PAL)
          size=$(mips-linux-gnu-size -A build/$V/assets/scenes/remix/ancient/ancient_title.o | awk '$1==".data"{print $2}')
          case "$V" in pal-*|gc-eu*) want=10368;; *) want=6912;; esac
          [ "$size" = "$want" ] || { echo "title card is $size bytes, expected $want"; exit 1; }

      - name: Biome copy (stand-in scene, no ROM) compiles
        run: |
          python3 -m pip install --user --break-system-packages -q "numpy>=1.26" "pillow>=10"
          python3 tools/remix/test_make_biome.py
          python3 tools/remix/test_make_biome.py --fixture extracted/${{ matrix.version }}
          python3 tools/remix/make_biome.py --version ${{ matrix.version }}
          rm -f build/${{ matrix.version }}/src/code/z_remix_menu.o
          make -j"$(nproc)" VERSION=${{ matrix.version }} \
            build/${{ matrix.version }}/src/code/z_remix_menu.o \
            build/${{ matrix.version }}/assets/scenes/overworld/spot00/spot00_scene.o \
            build/${{ matrix.version }}/assets/scenes/overworld/spot00/spot00_room_0.o \
            build/${{ matrix.version }}/assets/scenes/remix/tundra/tundra_scene.o \
            build/${{ matrix.version }}/assets/scenes/remix/tundra/tundra_room_0.o \
            build/${{ matrix.version }}/spec
          grep -q '"tundra_room_0"' build/${{ matrix.version }}/spec
          grep -q '"ancient_room_0"' build/${{ matrix.version }}/spec
          grep -q 'z_remix_level.o' build/${{ matrix.version }}/spec
          # The copy is linked next to the original: no symbol may be defined in both.
          B=build/${{ matrix.version }}/assets/scenes
          dup=$(comm -12 <(mips-linux-gnu-nm --defined-only -g $B/overworld/spot00/*.o | awk '{print $3}' | sort -u) \
                         <(mips-linux-gnu-nm --defined-only -g $B/remix/tundra/*.o | awk '{print $3}' | sort -u))
          if [ -n "$dup" ]; then echo "Symbols defined in both Hyrule Field and its copy:"; echo "$dup"; exit 1; fi
