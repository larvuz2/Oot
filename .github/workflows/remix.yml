name: Remix build

# Compiles this repo's (modified) source into an N64 ROM and publishes it to the
# web player as a BPS patch in web/patches/. Netlify then redeploys the site.
#
# Needs a base ROM to extract assets from. Provide a direct download link to
# your own dump as the repository secret BASEROM_URL (see REMIX.md). Without it
# this workflow does nothing and stays green.

on:
  push:
    branches: [main]
    paths-ignore:
      - "web/**"
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/web-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remix-build
  cancel-in-progress: true

env:
  FLIPS_COMMIT: ff216a75df0987047a67d7923567dc4482ce07ac

jobs:
  build:
    name: Build remix ROM and publish patch
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check for a base ROM
        id: gate
        env:
          BASEROM_URL: ${{ secrets.BASEROM_URL }}
        run: |
          if [ -z "$BASEROM_URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Remix build skipped::Set the BASEROM_URL repository secret to build ROMs (see REMIX.md)."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Install build dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential binutils-mips-linux-gnu curl python3 python3-pip python3-venv libxml2-dev

      - name: Download base ROM
        if: steps.gate.outputs.enabled == 'true'
        env:
          BASEROM_URL: ${{ secrets.BASEROM_URL }}
          BASEROM_AUTH_HEADER: ${{ secrets.BASEROM_AUTH_HEADER }}
        run: |
          mkdir -p "$RUNNER_TEMP/rom"
          if [ -n "$BASEROM_AUTH_HEADER" ]; then
            curl -fsSL --retry 3 -H "$BASEROM_AUTH_HEADER" -o "$RUNNER_TEMP/rom/download" "$BASEROM_URL"
          else
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/rom/download" "$BASEROM_URL"
          fi
          # Accept a .zip containing the ROM as well as a bare ROM file.
          python3 - "$RUNNER_TEMP/rom/download" "$RUNNER_TEMP/rom/baserom.bin" <<'EOF'
          import sys, zipfile, shutil
          src, dst = sys.argv[1], sys.argv[2]
          if zipfile.is_zipfile(src):
              with zipfile.ZipFile(src) as z:
                  info = max(z.infolist(), key=lambda i: i.file_size)
                  with z.open(info) as f, open(dst, "wb") as out:
                      shutil.copyfileobj(f, out)
          else:
              shutil.move(src, dst)
          EOF
          ls -l "$RUNNER_TEMP/rom/baserom.bin"

      - name: Identify ROM
        if: steps.gate.outputs.enabled == 'true'
        id: rom
        run: python3 tools/web/identify_rom.py "$RUNNER_TEMP/rom/baserom.bin" --github-output

      - name: Place base ROM
        if: steps.gate.outputs.enabled == 'true'
        run: cp "$RUNNER_TEMP/rom/baserom.bin" "baseroms/${{ steps.rom.outputs.version }}/baserom.z64"

      - name: Setup (extract assets)
        if: steps.gate.outputs.enabled == 'true'
        run: make -j"$(nproc)" setup VERSION=${{ steps.rom.outputs.version }}

      - name: Convert Character Studio model
        if: steps.gate.outputs.enabled == 'true' && hashFiles('assets/remix_character/character.json') != ''
        run: |
          sudo apt-get install -y -q clang-format-14
          python3 -m pip install --user --break-system-packages -q "numpy>=1.26" "pillow>=10" "fast-simplification>=0.1.7"
          python3 tools/remix/glb_to_oot.py --character assets/remix_character/character.json --if-changed

      - name: Make biomes (Frozen Tundra)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python3 -m pip install --user --break-system-packages -q "numpy>=1.26" "pillow>=10"
          python3 tools/remix/make_biome.py --version ${{ steps.rom.outputs.version }} \
            || echo "::warning title=Biome skipped::make_biome.py failed (see log); building without the Frozen Tundra."

      - name: Link the new level to Hyrule Field's textures and lights
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python3 tools/remix/link_level_assets.py --version ${{ steps.rom.outputs.version }} \
            || echo "::warning title=Ancient Plateau look::Could not read Hyrule Field's assets; the level uses its own textures."

      - name: Build ROM
        if: steps.gate.outputs.enabled == 'true'
        env:
          V: ${{ steps.rom.outputs.version }}
        run: |
          build() { make -j"$(nproc)" VERSION=$V REGION=${{ steps.rom.outputs.region }} COMPARE=0 ${{ vars.REMIX_MAKE_FLAGS }}; }
          if build; then md5sum build/$V/oot-$V.z64; exit 0; fi
          HF_LINK="build/$V/assets/scenes/remix/ancient/ancient_hf.h"
          if [ -f "$HF_LINK" ]; then
            # Never lose the build over the borrowed Hyrule Field look: retry with the level's own textures.
            echo "::warning title=Hyrule Field look dropped::The ROM did not build with Hyrule Field's textures in the new level; building without them."
            rm -f "$HF_LINK" build/$V/assets/scenes/remix/ancient/*.o
            if build; then md5sum build/$V/oot-$V.z64; exit 0; fi
          fi
          if [ -d "extracted/$V/assets/scenes/remix" ]; then
            # Never lose the whole remix over the biome: retry without it.
            echo "::warning title=Biome dropped::The ROM did not build with the Frozen Tundra; building without it."
            rm -rf "extracted/$V/assets/scenes/remix" "build/$V/assets/scenes/remix" "build/$V/src/code/z_remix_menu.o" "build/$V/spec"
            build
            md5sum build/$V/oot-$V.z64
            exit 0
          fi
          exit 1

      - name: Compare the new level's memory use with Hyrule Field
        if: steps.gate.outputs.enabled == 'true'
        env:
          V: ${{ steps.rom.outputs.version }}
        run: |
          python3 - "build/$V/oot-$V.elf" <<'PY'
          import subprocess, sys, re
          syms = {}
          for line in subprocess.run(["mips-linux-gnu-nm", sys.argv[1]], capture_output=True, text=True).stdout.splitlines():
              parts = line.split()
              if len(parts) == 3 and parts[2].endswith(("SegmentRomStart", "SegmentRomEnd")):
                  syms[parts[2]] = int(parts[0], 16)
          def size(seg):
              return syms[f"_{seg}SegmentRomEnd"] - syms[f"_{seg}SegmentRomStart"]
          hdr = open("assets/scenes/remix/ancient/ancient_scene.h").read()
          col = int(re.search(r"ANCIENT_SCENE_BGCHECK_MEMSIZE (0x[0-9A-Fa-f]+)", hdr).group(1), 16)
          # Hyrule Field is a "spot" scene: BgCheck gives it 0xF000 bytes of collision memory (z_bgcheck.c).
          hf = size("spot00_scene") + size("spot00_room_0") + 0xF000
          new = size("ancient_scene") + size("ancient_room_0") + col
          print(f"Hyrule Field: scene {size('spot00_scene') // 1024} KB, room {size('spot00_room_0') // 1024} KB, collision 60 KB -> {hf // 1024} KB")
          print(f"Ancient Plateau: scene {size('ancient_scene') // 1024} KB, room {size('ancient_room_0') // 1024} KB, collision {col // 1024} KB -> {new // 1024} KB")
          if new > hf:
              print(f"::warning title=Ancient Plateau memory::Uses {(new - hf) // 1024} KB more than Hyrule Field; actors may run out of memory.")
          else:
              print(f"Ancient Plateau uses {(hf - new) // 1024} KB less than Hyrule Field.")
          PY

      - name: Build Floating IPS
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git clone -q https://github.com/Alcaro/Flips "$RUNNER_TEMP/flips"
          git -C "$RUNNER_TEMP/flips" checkout -q "$FLIPS_COMMIT"
          make -C "$RUNNER_TEMP/flips" TARGET=cli CFLAGS=-O2

      - name: Create patch
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python3 tools/web/make_patch.py \
            --version ${{ steps.rom.outputs.version }} \
            --region ${{ steps.rom.outputs.region }} \
            --target build/${{ steps.rom.outputs.version }}/oot-${{ steps.rom.outputs.version }}.z64 \
            --flips "$RUNNER_TEMP/flips/flips" \
            --title "${{ vars.REMIX_TITLE || 'Remix' }}"

      - name: Smoke test the new level in the website's emulator
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        timeout-minutes: 20
        env:
          V: ${{ steps.rom.outputs.version }}
        run: |
          npm install --silent --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium-headless-shell >/dev/null
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" python3 tools/remix/smoke_test.py --rom "build/$V/oot-$V.z64" --elf "build/$V/oot-$V.elf" --out "$RUNNER_TEMP/smoke"

      - name: Upload smoke test screenshots
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: smoke-screenshots
          path: |
            ${{ runner.temp }}/smoke/**/*.png
            ${{ runner.temp }}/smoke/**/capture.json
          retention-days: 3

      - name: Upload patch artifact
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: remix-patch-${{ steps.rom.outputs.version }}-${{ steps.rom.outputs.region }}
          path: web/patches/

      - name: Commit patch to the site
        # Only from main: a manual run on another branch is a test build.
        if: steps.gate.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/patches assets/objects/object_remix_model
          if git diff --cached --quiet; then
            echo "Patch unchanged."
            exit 0
          fi
          git commit -m "Publish remix build for ${{ steps.rom.outputs.label }} (${GITHUB_SHA::7})"
          for i in 1 2 3 4; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
